[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkms-backend"
version = "1.0.0"
description = "Autonomous Personal Knowledge Management System — non-generative backend"
requires-python = ">=3.11"
dependencies = [
    # --- Web framework ---
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "sse-starlette==2.1.0",

    # --- Task queue ---
    "celery[redis]==5.4.0",
    "kombu==5.3.4",
    "redis==5.0.4",

    # --- Database ---
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",   # for alembic sync env

    # --- Auth ---
    "pyjwt==2.8.0",
    "bcrypt==4.1.3",
    "passlib[bcrypt]==1.7.4",

    # --- Config ---
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",

    # --- Embeddings ---
    "sentence-transformers==3.0.0",
    "torch==2.3.0",              # CPU wheel; pin after confirming platform

    # --- NLP ---
    "spacy==3.7.4",
    "fastcoref==2.1.6",
    "pytextrank==3.3.0",

    # --- OCR ---
    "pytesseract==0.3.10",
    "Pillow==10.3.0",

    # --- Document extraction ---
    "pypdf==4.2.0",
    "pdfplumber==0.11.1",
    "python-docx==1.1.2",
    "markdown-it-py==3.0.0",
    "trafilatura==1.9.0",
    "python-magic==0.4.27",

    # --- Vector store ---
    "chromadb==0.5.0",

    # --- Graph DB ---
    "neo4j==5.20.0",

    # --- Dedup ---
    "datasketch==1.6.5",

    # --- ML / classical ---
    "scikit-learn==1.4.2",
    "scipy==1.13.0",
    "numpy==1.26.4",
    "networkx==3.3",
    "joblib==1.4.2",

    # --- Observability ---
    "structlog==24.1.0",

    # --- Utilities ---
    "httpx==0.27.0",
    "python-slugify==8.0.4",
    "orjson==3.10.3",
]

[project.optional-dependencies]
easyocr = ["easyocr==1.7.1"]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "mypy==1.10.0",
    "httpx==0.27.0",
    "testcontainers[postgres]==4.5.1",
    "factory-boy==3.3.0",
    "Faker==25.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/tests/*"]
